[project]
name = "fuzzworkbot"
version = "0.1.0"
description = "Fuzzwork Discord bot: EVE verification, giveaways, role reactions"
requires-python = ">=3.12"
dependencies = [
    "disnake>=2.9",
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
    "requests>=2.31",
    "requests-cache>=1.2",
    "python-dotenv>=1.0",
    "click>=8.1",
    "questionary>=2.0",
]

[project.scripts]
fuzzworkbot = "fuzzworkbot.bot:main"
giveaway-cli = "fuzzworkbot_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fuzzworkbot", "src/fuzzworkbot_cli"]

[tool.uv]
package = true
